<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80" role="img" aria-labelledby="marcaTitle marcaDesc">
  <title id="marcaTitle">Logomarca CDT Jacarepaguá</title>
  <desc id="marcaDesc">Cartão de TODOS — cadastro financeiro, unidade Jacarepaguá</desc>
  <defs>
    <linearGradient id="gBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c97a"/>
      <stop offset="100%" stop-color="#008f58"/>
    </linearGradient>
    <linearGradient id="gCard" x1="12" y1="18" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>

  <!-- Ícone -->
  <rect x="4" y="8" width="64" height="64" rx="14" fill="url(#gBrand)"/>
  <rect x="18" y="28" width="36" height="26" rx="5" fill="url(#gCard)"/>
  <rect x="22" y="32" width="12" height="9" rx="2" fill="#fbbf24"/>
  <rect x="22" y="32" width="12" height="9" rx="2" fill="none" stroke="#ca8a04" stroke-width="0.5"/>
  <circle cx="48" cy="48" r="8" fill="#fff"/>
  <path d="M45.5 48l1.8 1.8 4.5-4.7" fill="none" stroke="#00a868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nome e hierarquia -->
  <text x="82" y="34" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em">CDT Jacarepaguá</text>
  <text x="82" y="52" fill="#00a868" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.14em">CARTÃO DE TODOS</text>
  <path d="M82 58h200" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
</svg>